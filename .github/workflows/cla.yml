name: CLA

# CLA Assistant Lite asks first-time contributors to sign CLA.md by commenting on their pull
# request, and records each signature in the cla-signatures branch. It never checks out or runs
# pull request code, which is what makes pull_request_target safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: Check CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/YourAKShaw/irisveil/blob/main/CLA.md
          branch: cla-signatures
          allowlist: YourAKShaw,dependabot[bot],*[bot]
          create-file-commit-message: "chore(cla): create the CLA signature file"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in #$pullRequestNo"
          custom-notsigned-prcomment: >-
            Thank you for contributing to IrisVeil! Before we can merge this, please read the
            [Contributor License Agreement](https://github.com/YourAKShaw/irisveil/blob/main/CLA.md).
            It keeps IrisVeil open source under the AGPL-3.0 while you keep the copyright in your
            work. To sign, reply to this pull request with the exact sentence below.
          custom-allsigned-prcomment: All contributors have signed the IrisVeil CLA. Thank you!
